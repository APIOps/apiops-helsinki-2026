<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="title description">
  <title id="title">APIOps local communities around the world</title>
  <desc id="description">A light blue world map with markers for APIOps communities in the United States, Europe, and North Africa.</desc>
  <defs>
    <filter id="marker-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="490" fill="#fff"/>

  <!-- A deliberately borderless silhouette keeps the map calm and readable at small sizes. -->
  <g fill="#8fc1f4">
    <!-- North America -->
    <path d="M47 126l12-20 17-9 7-17 20-12 29-1 17-12 31 3 22-12 34 2 13 11 17-2 12 12 21 1 18 17 5 17 17 13-7 16-22 2-14 14-17 4-8 18-15 6-6 18-14 3-9 23-14 4-14-16-22-7-17-18-24-2-10-15-22-8-11-17-26-8-2-13-19-1-7-13-21-3-5-15z"/>
    <path d="M80 171l-20-4-9-12 6-8 19 7 11 10zm203 52l16-9 15 7 5 16-12 10-15-5zm30 22l13 2 13 13-4 10-14-7z"/>

    <!-- Greenland and the Canadian Arctic islands -->
    <path d="M269 36l21-18 47-8 39 8 8 18-15 25-7 28-22 19-29-5-17-22-18-15z"/>
    <path d="M112 54l14-17 25-8 13 8-13 12-19 3zm48-13l15-17 27-6 19 7-3 12-26 4zm56-19l24-12 20 4 2 14-22 7zm-121 73L71 90l3-13 21-8 17 7z"/>

    <!-- Central America and the Caribbean -->
    <path d="M223 236l19 3 8 13 15 5 3 11 18 7-4 10-20-5-9-12-17-4-7-13-13-5z"/>
    <path d="M287 258l18-3 11 5-8 7zm29 11l20-3 15 5-4 6-23-1zm36 7l16-2 8 5-12 5z"/>

    <!-- South America -->
    <path d="M290 286l22-13 34 4 32 19 19 29-9 29-13 19-8 28-16 17-7 31-17 30-13-5-2-31-14-23-2-29-13-24-8-30-16-21 7-20z"/>

    <!-- Europe and Asia -->
    <path d="M399 112l13-14 17 1 9-18 18-8 18 8 13-12 25 5 17-20 27 4 12-14 31 2 18 11 25-4 19 11 25-2 20 13 42-1 16 9 31 1 11 13 31 7 25 18-8 13-25-2-14 11-19 1-7 14-17 8-18-4-12 14-29 10-6 13-28 7-6 14-19 4-18-11-12 17-18-3-8 13-13 2-5-19-20-10-8-14-19 4-16-12-19 5-17-13-23 4-15-10-19 8-12-5-14 9-14-4-8-14-17 7-13-8-12 4-9-13-19-5-3-17-13-7-17 4-6-11z"/>
    <!-- Scandinavia, Britain, Iceland, Japan and Asian islands -->
    <path d="M482 102l-3-25 13-21 12-3 10 12-8 19-13 21zm20-1l9-27 17-15 12 4-3 19-18 24zM430 116l-14-13 3-17 13-5 9 12zm-23-28l-17-2-8-9 14-7 17 7zm399 108l10-20 10 4-2 19-12 14zm-4 30l12-8 8 13-8 19-10-5z"/>

    <!-- Africa and Arabia -->
    <path d="M437 202l23-18 42-4 37 13 20 26-8 30-17 26-5 37-17 25-8 37-19 31-22-4-13-31-16-20-5-35-18-28-3-35-14-24 8-23z"/>
    <path d="M548 225l30 3 25 21-4 20-19-1-13-16-19-12zm-26 151l11 9-5 31-12 19-8-10 5-33z"/>

    <!-- India and south-east Asian peninsulas -->
    <path d="M619 222l27 12 8 21-9 30-12 15-11-28-13-23zm58 15l17 18 4 24 16 17-7 12-18-22-11-24-13-12zm31 77l17 2 11 10-14 7zm29 18l24 5 16 13-6 7-24-8z"/>

    <!-- Indonesia, the Philippines and Pacific islands -->
    <path d="M739 278l8-18 9 3-1 20-8 10zm-6 62l16 5 8 12-17-3zm32 16l22-1 13 8-8 7-24-4zm43 13l21-2 13 8-8 7-24-4zm57 15l10-5 10 7-9 8z"/>

    <!-- Australia, Tasmania and New Zealand -->
    <path d="M743 371l19-23 29-9 35 5 25 20 2 28-15 31-25 14-20-7-19 5-18-16-17-15z"/>
    <path d="M818 444l13 4-4 18-11-4zm77-31l8-17 10-4-2 15-9 14zm-10 25l9-11 7 3-6 18-11 10z"/>

    <!-- A few small island groups preserve the airy detail of the reference. -->
    <circle cx="384" cy="207" r="3"/><circle cx="366" cy="300" r="2.5"/><circle cx="206" cy="340" r="2.5"/>
    <circle cx="891" cy="291" r="2.5"/><circle cx="916" cy="321" r="2"/><circle cx="650" cy="424" r="2.5"/>
  </g>

  <!-- Community locations remain visible without covering the geographic silhouette. -->
  <g fill="#b83ee5" stroke="#fff" stroke-width="2.5" filter="url(#marker-glow)">
    <circle cx="198" cy="180" r="5"/><circle cx="239" cy="176" r="5"/><circle cx="278" cy="159" r="5"/>
    <circle cx="462" cy="143" r="5"/><circle cx="477" cy="126" r="5"/><circle cx="493" cy="129" r="5"/>
    <circle cx="508" cy="102" r="5"/><circle cx="521" cy="116" r="5"/>
    <circle cx="449" cy="220" r="5"/><circle cx="501" cy="215" r="5"/>
  </g>
</svg>
